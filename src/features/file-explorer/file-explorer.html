<div class="file-explorer">
  <div class="file-explorer__toolbar">
    <h2 class="file-explorer__title">{{ labels().title }}</h2>
    <span class="file-explorer__spacer"></span>
    <button
      matIconButton
      type="button"
      (click)="newFile()"
      [matTooltip]="'New ' + labels().file"
      [attr.aria-label]="'New ' + labels().file"
    >
      <mat-icon>note_add</mat-icon>
    </button>
    <button
      matIconButton
      type="button"
      (click)="newFolder()"
      matTooltip="New folder"
      aria-label="New folder"
    >
      <mat-icon>create_new_folder</mat-icon>
    </button>
  </div>

  <!-- The move search looks through lines, so it belongs to the lines tree only. -->
  @if (tree() === 'lines') {
    <app-line-search
      class="file-explorer__search"
      [class.file-explorer__search--expanded]="searching()"
      (searching)="searching.set($event)"
    />
  }

  <!-- The search results take the tree's place while a search is running. -->
  @if (!searching()) {
    @if (rootNodes().length > 0) {
      <ul
        class="file-explorer__tree"
        [class.file-explorer__tree--drop-target]="rootDropActive()"
        role="tree"
        [attr.aria-label]="labels().title"
        (dragover)="onRootDragOver($event)"
        (dragleave)="onRootDragLeave()"
        (drop)="onRootDrop($event)"
      >
        @for (node of rootNodes(); track node.id) {
          <li>
            <app-tree-node [nodeId]="node.id" />
          </li>
        }
      </ul>
    } @else {
      <p class="file-explorer__empty">
        Nothing here yet. Use the buttons above to create a folder or a {{ labels().file }}.
      </p>
    }
  }
</div>
