<mat-nav-list aria-label="Main navigation">
  <a
    mat-list-item
    routerLink="/"
    routerLinkActive
    #homeLink="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [activated]="homeLink.isActive"
    [attr.aria-current]="homeLink.isActive ? 'page' : null"
    (click)="navigate.emit()"
  >
    <mat-icon matListItemIcon fontSet="material-symbols-outlined">home</mat-icon>
    <span matListItemTitle>Home</span>
  </a>
  <a
    mat-list-item
    routerLink="/diagrams"
    routerLinkActive
    #diagramsLink="routerLinkActive"
    [activated]="diagramsLink.isActive"
    [attr.aria-current]="diagramsLink.isActive ? 'page' : null"
    (click)="navigate.emit()"
  >
    <mat-icon matListItemIcon fontSet="material-symbols-outlined">insert_chart</mat-icon>
    <span matListItemTitle>Board diagrams</span>
  </a>
  <a
    mat-list-item
    routerLink="/notes"
    routerLinkActive
    #notesLink="routerLinkActive"
    [activated]="notesLink.isActive"
    [attr.aria-current]="notesLink.isActive ? 'page' : null"
    (click)="navigate.emit()"
  >
    <mat-icon matListItemIcon fontSet="material-symbols-outlined">sticky_note_2</mat-icon>
    <span matListItemTitle>Multi step notes</span>
  </a>
  <a
    mat-list-item
    routerLink="/positions"
    routerLinkActive
    #positionsLink="routerLinkActive"
    [activated]="positionsLink.isActive"
    [attr.aria-current]="positionsLink.isActive ? 'page' : null"
    (click)="navigate.emit()"
  >
    <mat-icon matListItemIcon fontSet="material-symbols-outlined">grid_on</mat-icon>
    <span matListItemTitle>Position search</span>
  </a>
</mat-nav-list>
